---
# role: logindefs
# file: molecule/resources/playbooks/verify.yml

- name: LOGINDEFS | Verify configuration policy and new-account defaults
  hosts: all
  gather_facts: false
  vars:
    __logindefs_test_user: logindefs_molecule
  tasks:
    - name: LOGINDEFS | Read the managed configuration
      ansible.builtin.slurp:
        path: /etc/login.defs
      register: __logindefs_verify_file

    - name: LOGINDEFS | Verify conservative updates and override precedence
      ansible.builtin.assert:
        that:
          - __logindefs_expected_line in (__logindefs_verify_file.content | b64decode).splitlines()
        quiet: true
      loop:
        - '# Unmanaged distribution configuration must survive.'
        - UMASK 077
        - PASS_MAX_DAYS 90
        - PASS_MIN_DAYS 1
        - HOME_MODE 0700
        - CREATE_HOME yes
        - ENCRYPT_METHOD SHA512
        - '# LOGIN_TIMEOUT 120'
        - '# HUSHLOGIN_FILE .hushlogin'
      loop_control:
        loop_var: __logindefs_expected_line
        label: "{{ __logindefs_expected_line }}"

    - name: LOGINDEFS | Verify missing, commented and disabled keys stay inactive
      ansible.builtin.assert:
        that:
          - (__logindefs_verify_file.content | b64decode) is not regex('(?m)^[ \t]*(LOGIN_TIMEOUT|LOGIN_RETRIES|HUSHLOGIN_FILE)[ \t]+')
        quiet: true

    - name: LOGINDEFS | Verify defaults applied to a new account
      block:
        - name: LOGINDEFS | Remove a stale verification account
          become: true
          become_user: root
          ansible.builtin.user:
            name: "{{ __logindefs_test_user }}"
            state: absent
            remove: true

        - name: LOGINDEFS | Create an account using the system defaults
          become: true
          become_user: root
          ansible.builtin.user:
            name: "{{ __logindefs_test_user }}"
            home: "/home/{{ __logindefs_test_user }}"
            create_home: true

        - name: LOGINDEFS | Inspect home directory permissions
          ansible.builtin.stat:
            path: "/home/{{ __logindefs_test_user }}"
          register: __logindefs_home

        - name: LOGINDEFS | Verify private home directory permissions
          ansible.builtin.assert:
            that:
              - __logindefs_home.stat.isdir
              - __logindefs_home.stat.mode == '0700'
            quiet: true

        - name: LOGINDEFS | Read password aging without password hashes
          become: true
          become_user: root
          ansible.builtin.command:
            argv: [chage, --list, "{{ __logindefs_test_user }}"]
          environment:
            LC_ALL: C
          changed_when: false
          register: __logindefs_aging

        - name: LOGINDEFS | Verify password aging for the new account
          ansible.builtin.assert:
            that:
              - __logindefs_aging.stdout is regex('(?m)^Maximum number of days between password change[ \t]*:[ \t]*90$')
              - __logindefs_aging.stdout is regex('(?m)^Number of days of warning before password expires[ \t]*:[ \t]*7$')
            quiet: true
      always:
        - name: LOGINDEFS | Remove the verification account
          become: true
          become_user: root
          ansible.builtin.user:
            name: "{{ __logindefs_test_user }}"
            state: absent
            remove: true
